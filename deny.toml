# Configuration cargo-deny — garde-fou licences + advisories (CI).
# Produit vendu sous MIT : toute dépendance copyleft (GPL/AGPL/…) doit être
# bloquée ici et discutée avant d'entrer dans l'arbre.

[graph]
all-features = false

[advisories]
# RUSTSEC : vulnérabilités = erreur ; crates non maintenus = avertissement.
yanked = "deny"
ignore = [
    # ttf-parser non maintenu (informatif, pas une vulnérabilité) : tiré
    # transitivement par winit → sctk-adwaita (décorations Wayland Linux).
    # Aucune alternative sans changer winit — à re-vérifier aux MAJ winit.
    { id = "RUSTSEC-2026-0192", reason = "transitif via winit/sctk-adwaita, pas de correctif disponible" },
]

[licenses]
# Licences permissives « notice seulement » acceptées pour la redistribution
# binaire (les notices sont générées dans licenses/THIRD-PARTY-NOTICES.html
# par cargo-about — voir tools/package.ps1).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # webpki-roots : le magasin de certificats racines de Mozilla, tiré par
    # ureq (vérification de mise à jour, opt-in). Ce n'est PAS du code mais
    # une DONNÉE, sous licence de données permissive — pas de copyleft, pas
    # de réciprocité, la seule obligation en redistribution est de conserver
    # les avis (assurée par THIRD-PARTY-NOTICES.html). Compatible avec un
    # produit vendu sous MIT.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# On ne bloque pas les versions multiples (bruit) — la CI surveille
# licences et advisories, pas l'hygiène de graphe.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
