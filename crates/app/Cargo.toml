[package]
name = "conduite"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "conduite"
path = "src/main.rs"

[build-dependencies]
# Ressources exe Windows (icône + VERSIONINFO) — no-op sur les autres cibles.
winresource = "0.1.23"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.7.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
conduite-compositor = { version = "0.1.0", path = "../compositor" }
conduite-control-artnet = { version = "0.1.0", path = "../control-artnet" }
conduite-control-http = { version = "0.1.0", path = "../control-http" }
conduite-control-midi = { version = "0.1.0", path = "../control-midi" }
conduite-control-osc = { version = "0.1.0", path = "../control-osc" }
conduite-core = { version = "0.1.0", path = "../core" }
conduite-cue = { version = "0.1.0", path = "../cue" }
conduite-engine = { version = "0.1.0", path = "../engine" }
conduite-isf = { version = "0.1.0", path = "../isf" }
conduite-media-library = { version = "0.1.0", path = "../media-library" }
conduite-modulation = { version = "0.1.0", path = "../modulation" }
conduite-params = { version = "0.1.0", path = "../params" }
conduite-system = { version = "0.1.0", path = "../system" }
cpal = "0.15.3"
crossbeam-channel = "0.5.16"
glow = "0.18.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_kqueue"] }
raw-window-handle = "0.6.2"
ringbuf = "0.3.3"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
winit = "0.30.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
